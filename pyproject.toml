[build-system]
requires = ["hatchling==1.27.0", "hatch-vcs==0.5.0", "livingproof-common @ https://github.com/Living-Proof-Labs/livingproof-common/releases/download/v1.0.0/livingproof_common-1.0.0-py3-none-any.whl#sha256=8b7795748b54eeb89610f3716245f45db48ac0474465a5abbf974e7075c1476c"]
build-backend = "hatchling.build"

[project]
name = "livingproof"
dynamic = ["version"]
description = "Living Proof Labs command home for installed capability plugins"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSES/*.txt", "LICENSE.md"]
dependencies = ["livingproof-common==1.0.0", "click>=8.1,<9", "packaging>=23"]

[project.scripts]
livingproof = "livingproof.cli:main"

[tool.hatch.build.targets.wheel.shared-data]
"completions/livingproof" = "share/bash-completion/completions/livingproof"

[tool.hatch.version]
source = "vcs"
[tool.hatch.version.raw-options]
fallback_version = "0.0.0"
local_scheme = "no-local-version"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.2",
    "build==1.3.0",
    "installer==0.7.0",
    "pytest-bdd==8.1.0",
    "sphinx==8.2.3",
    "sphinx-click==6.2.0",
]
docs-comparison = [
    "furo==2025.12.19",
    "mkdocs-click==0.9.0",
    "myst-parser==5.1.0",
    "playwright==1.64.1",
    "zensical==0.0.73",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests/unit"]
junit_logging = "all"
[tool.ruff]
line-length = 100

[tool.uv.sources]
livingproof-common = { url = "https://github.com/Living-Proof-Labs/livingproof-common/releases/download/v1.0.0/livingproof_common-1.0.0-py3-none-any.whl" }
