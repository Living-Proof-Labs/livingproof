# SPDX-License-Identifier: Apache-2.0
# Requires uv, project Python, pyproject.toml, and uv.lock with Ruff/pytest in dev.
version: '3'

tasks:
  setup:
    desc: Sync locked dependencies into the project environment
    cmds:
      - uv sync --locked --inexact --no-python-downloads
  check:
    desc: Check Python with locked Ruff
    cmds:
      - uv run --locked --no-sync --no-python-downloads ruff check .
  test:
    desc: Run locked pytest --junitxml=artifacts/tests.xml
    cmds:
      - uv run --locked --no-sync --no-python-downloads pytest --junitxml=artifacts/tests.xml
  verify:
    desc: Run checks and tests
    cmds:
      - task: check
      - task: test
  package:
    desc: Build wheel, source and portable Debian package
    cmds:
      - uv run --locked --no-sync python tools/fetch_common.py
      - uv build --no-sources
      - uv run --locked --no-sync python tools/debian.py
      - uv run --locked --no-sync python tools/checksums.py
  smoke:
    desc: Check clean installed wheel consumption
    cmds:
      - uv run --locked --no-sync python tools/smoke.py
  dev:build:
    platforms: [linux]
    desc: Build the shared Docker development target
    cmds:
      - docker compose build development
  dev:verify:
    platforms: [linux]
    desc: Run setup and verification in the development image without nested Docker
    cmds:
      - docker compose run --rm --user "$(id -u):$(id -g)" development bash -c 'task setup && task verify'
  dev:shell:
    platforms: [linux]
    desc: Open the development image and set up its environment
    interactive: true
    cmds:
      - docker compose run --rm --user "$(id -u):$(id -g)" development bash -c 'task setup && exec bash'
  integration:
    desc: Verify real installed reporting from the pinned published release
    cmds:
      - uv run --locked --no-sync python tools/fetch_reporter.py
      - task: smoke
  plugin:install:
    desc: Explicitly install the pinned reporter into the development Python environment
    cmds:
      - uv run --locked --no-sync python tools/fetch_reporter.py
      - uv run --locked --no-sync python tools/install_plugin.py
  images:
    desc: Build native root and reporting images from verified wheels
    cmds:
      - uv run --locked --no-sync python tools/distributions.py
  test:installed:
    desc: Test real installed distributions and emit individual JUnit results
    cmds:
      - uv run --locked --no-sync pytest tests/installed --junitxml=artifacts/installed-tests.xml
  test:devcontainer:
    desc: Exercise the actual devcontainer lifecycle and emit JUnit results
    cmds:
      - uv run --locked --no-sync pytest tests/lifecycle --junitxml=artifacts/devcontainer-tests.xml
  test:features:
    desc: Run executable installed-user scenarios in fresh offline containers
    cmds:
      - uv run --locked --no-sync pytest tests/features --junitxml=artifacts/feature-tests.xml
  features:results:
    desc: Map scenario coverage to actual JUnit outcomes (missing results fail)
    cmds:
      - uv run --locked --no-sync python tools/feature_results.py
  docs:
    desc: Build the Markdown manual from packaged Click commands and current scenario results
    cmds:
      - uv run --locked --no-sync python tools/docs.py
  docs:test:setup:
    desc: Install the separately locked browser test tools
    cmds:
      - uv sync --locked --inexact --no-python-downloads --group docs-test
  test:docs:
    desc: Check manual links, command sections and real browser behavior
    cmds:
      - uv run --locked --no-sync --group docs-test pytest tests/docs --junitxml=artifacts/docs-tests.xml
